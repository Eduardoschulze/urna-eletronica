<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna da turma</title>
<style>
body{
            font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px;color:#222
        }nav,.botoes-urna{
            display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px
        }button{
            padding:9px 14px;cursor:pointer
        }.aba.ativa{
            background:#145da0;color:white
        }.tela{
            display:none;border:1px solid #ccc;border-radius:8px;padding:18px
        }.tela.ativa{
            display:block
        }input{
            padding:9px;margin:5px 0
        }#numerovoto{
            width:70px;font-size:24px;text-align:center
        }.fim{
            display:none;font-size:28px;font-weight:bold;margin:20px 0
        }li{
            margin:8px 0
        }.item-resultado{
            padding:10px 0;border-bottom:1px solid #ddd
        }.linha{
            display:flex;justify-content:space-between;gap:10px
        }.barra{
            height:10px;background:#eee;margin-top:6px
        }.barra div{
            height:100%;background:#145da0
        }
</style>
</head>
<body>
<header>
<h1>Urna da turma</h1>
<nav>
<button class="aba ativa" data-tela="votacao">Votar</button>
<button class="aba" data-tela="candidatos">Candidatos</button>
<button class="aba" data-tela="resultado">Apuração</button>
</nav>
</header>
<main>
<section id="votacao" class="tela ativa">
<h2>Votação</h2>
<p>Digite o número do candidato:</p>
<input type="text" id="numerovoto" maxlength="2" inputmode="numeric" autocomplete="off">
<div id="previa" aria-live="polite">
</div>
<div class="botoes-urna">
<button id="btnBranco">Branco</button>
<button id="btnCorrige">Corrige</button>
<button id="btnConfirma">Confirma</button>
</div>
<div id="fim" class="fim">Fim. Voto registrado!</div>
</section>
<section id="candidatos" class="tela">
<h2>Cadastrar candidato</h2>
<form id="formCandidato">
<input type="text" id="nomeCandidato" placeholder="Nome do aluno" required>
<input type="text" id="numeroCandidato" placeholder="Número (ex.: 10)" maxlength="2" inputmode="numeric" required>
<button type="submit">Adicionar</button>
</form>
<h2>Candidatos cadastrados</h2>
<ul id="listaCandidatos">
</ul>
</section>
<section id="resultado" class="tela">
<h2>Apuração</h2>
<p id="totalVotos">
</p>
<div id="listaResultado">
</div>
<button id="btnZerar">Zerar votos</button>
</section>
</main>
<script src="script.js">
</script>
</body>
</html>
